# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/sdk_publish.rs
name: SDK Publish
'on':
  push:
    branches:
    - main
    paths:
    - '.github/workflows/sdk-publish.yml'
    - packages/sdk/**
jobs:
  publish:
    name: Publish to npm
    runs-on: namespace-profile-linux-small
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: https://registry.npmjs.org
        always-auth: 'true'
    - name: Install dependencies
      run: bun install --frozen-lockfile
      working-directory: packages/sdk
    - id: guard
      name: Check whether version is already published
      run: |
        set -euo pipefail
        version="$(npm pkg get version | tr -d '"')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if npm view "@macro/sdk@$version" version >/dev/null 2>&1; then
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          echo "@macro/sdk@$version is already published; skipping."
        else
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "@macro/sdk@$version is not on npm; will publish."
        fi
      working-directory: packages/sdk
    - name: Build
      if: steps.guard.outputs.should_publish == 'true'
      run: bun run build
      working-directory: packages/sdk
    - name: Publish to npm
      if: steps.guard.outputs.should_publish == 'true'
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      working-directory: packages/sdk
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
